<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Responsive Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* CONTAINER */
        .wrapper {
            display: flex;
            flex-wrap: wrap;
            font-family: Arial, sans-serif;
        }

        /* HEADER */
        header {
            background: orange;
            width: 100%;
            padding: 20px;
            text-align: center;
            color: white;
        }

        /* NAV */
        nav {
            background: black;
            width: 100%;
        }

        nav ul {
            display: flex;
            justify-content: center;
            list-style: none;
        }

        nav a {
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        /* MAIN */
        .main {
            width: 60%;
            background: #ddd;
            padding: 20px;
        }

        /* ASIDES */
        .aside {
            width: 20%;
            padding: 20px;
        }

        .aside-1 {
            background: #ccc;
        }

        .aside-2 {
            background: #bbb;
        }

        /* FOOTER */
        footer {
            background: orange;
            width: 100%;
            text-align: center;
            padding: 20px;
            color: white;
        }

        /* ========================= */
        /* 📱 RESPONSIVO (CELULAR) */
        /* ========================= */
        @media (max-width: 480px) {

            nav ul {
                flex-direction: column;
                align-items: center;
            }

            .main,
            .aside {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <header>Header</header>

        <nav>
            <ul>
                <li><a href="#">Link1</a></li>
                <li><a href="#">Link2</a></li>
                <li><a href="#">Link3</a></li>
            </ul>
        </nav>

        <article class="main">
            <p>
                Pellentesque habitant morbi tristique egestas. Vestibulum tortor quam,
                feugiat vitae, ultricies eget, tempor sit amet, ante.
                Donec eu libero sit amet quam egestas semper.
            </p>
        </article>

        <aside class="aside aside-1">Aside 1</aside>
        <aside class="aside aside-2">Aside 2</aside>

        <footer>Footer</footer>
    </div>
</body>
</html>
